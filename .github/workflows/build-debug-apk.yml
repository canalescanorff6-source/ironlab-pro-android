name: IRONLAB Android - Compilar APK
on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Verificar e compilar Android
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Incluir a versao publicada do treino no APK
        run: python3 scripts/bundle_fitness_site.py
      - name: Validar projeto Android
        run: python3 tests/validate_project.py
      # GitHub ubuntu-latest already includes Android command-line tools.
      # The third-party setup action currently fails attempting obsolete SDK package 'tools'.
      - name: Preparar o Android SDK 36
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager -print -quit)"
          if [[ -z "$SDKMANAGER" ]]; then
            echo "::error::sdkmanager não encontrado em $SDK_ROOT/cmdline-tools"
            exit 1
          fi
          yes | "$SDKMANAGER" --sdk_root="$SDK_ROOT" --licenses > /dev/null || true
          "$SDKMANAGER" --sdk_root="$SDK_ROOT" --install "platforms;android-36" "build-tools;36.0.0"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Compilar APK normal e instalador independente
        run: gradle --no-daemon :app:assembleDebug :app:assembleSafeInstall
      - name: Validar integridade, assinatura e pacote Android
        shell: bash
        run: |
          set -euo pipefail
          TOOLS="${ANDROID_HOME}/build-tools/36.0.0"
          STANDARD="app/build/outputs/apk/debug/app-debug.apk"
          SAFE="app/build/outputs/apk/safeInstall/app-safeInstall.apk"
          test -s "$STANDARD"
          test -s "$SAFE"
          for apk in "$STANDARD" "$SAFE"; do
            echo "===== Verificando $apk ====="
            unzip -t "$apk" | tail -n 1
            "$TOOLS/apksigner" verify --verbose --print-certs "$apk"
            "$TOOLS/aapt" dump badging "$apk" | head -n 4
            sha256sum "$apk"
          done
          "$TOOLS/aapt" dump badging "$STANDARD" | grep -F "package: name='com.ironlab.pro'"
          "$TOOLS/aapt" dump badging "$SAFE" | grep -F "package: name='com.ironlab.pro.safe.v16'"
          echo "Estruturas ZIP, pacotes e assinaturas validados."

      - name: Publicar APK debug como artifact
        uses: actions/upload-artifact@v4
        with:
          name: IRONLAB-PRO-1.6.0-debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publicar APK independente como artifact
        uses: actions/upload-artifact@v4
        with:
          name: IRONLAB-PRO-1.6.0-instalacao-paralela
          path: app/build/outputs/apk/safeInstall/app-safeInstall.apk
          if-no-files-found: error
          retention-days: 30
      - name: Publicar APK beta em link direto do GitHub Releases
        if: github.ref == 'refs/heads/main'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="v1.6.0-beta"
          APK="$RUNNER_TEMP/IRONLAB-PRO-Android-1.6.0-debug.apk"
          SAFE="$RUNNER_TEMP/IRONLAB-PRO-Android-1.6.0-instalacao-paralela.apk"
          HASHES="$RUNNER_TEMP/SHA256SUMS.txt"
          cp app/build/outputs/apk/debug/app-debug.apk "$APK"
          cp app/build/outputs/apk/safeInstall/app-safeInstall.apk "$SAFE"
          (cd "$RUNNER_TEMP" && sha256sum "$(basename "$APK")" "$(basename "$SAFE")" > "$(basename "$HASHES")")
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$APK" "$SAFE" "$HASHES" --clobber
          else
            gh release create "$TAG" "$APK" "$SAFE" "$HASHES" \
              --title "IRONLAB PRO Android 1.6.0 (hipertrofia terça a sexta e uso offline)" \
              --notes "Plano de terça a sexta com prioridade superior, 3–4 séries, ajustes de carga conforme desempenho, histórico, backup e sincronização por código. Inclui uma cópia do site publicado para abrir treinos sem internet. Vídeos, rádio e sincronização usam internet. O APK independente usa com.ironlab.pro.safe.v16 e instala ao lado de versões anteriores. Transfira os registros por Evolução > Backup e restauração. A assinatura desta linha beta pode impedir atualização sobre versões antigas; mantenha a instalação anterior até restaurar seus dados. Pacote verificado por ZIP, apksigner e aapt; o teste no aparelho físico continua pendente." \
              --prerelease
          fi

      - name: Configurar assinatura release privada (opcional)
        id: signing
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.IRONLAB_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.IRONLAB_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.IRONLAB_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.IRONLAB_KEY_PASSWORD }}
        run: |
          if [[ -n "$KEYSTORE_BASE64" && -n "$STORE_PASSWORD" && -n "$KEY_ALIAS" && -n "$KEY_PASSWORD" ]]; then
            printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/ironlab-release.jks"
            chmod 600 "$RUNNER_TEMP/ironlab-release.jks"
            echo "IRONLAB_KEYSTORE_FILE=$RUNNER_TEMP/ironlab-release.jks" >> "$GITHUB_ENV"
            echo "IRONLAB_KEYSTORE_PASSWORD=$STORE_PASSWORD" >> "$GITHUB_ENV"
            echo "IRONLAB_KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
            echo "IRONLAB_KEY_PASSWORD=$KEY_PASSWORD" >> "$GITHUB_ENV"
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Compilar release assinado para atualizações futuras
        if: steps.signing.outputs.enabled == 'true'
        run: gradle --no-daemon :app:assembleRelease
      - name: Publicar APK release assinado
        if: steps.signing.outputs.enabled == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: IRONLAB-PRO-1.6.0-release-signed-APK
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30
      - name: Gerar checksums do APK
        if: always()
        shell: bash
        run: |
          if [[ -f app/build/outputs/apk/debug/app-debug.apk ]]; then
            sha256sum app/build/outputs/apk/debug/app-debug.apk
          fi
          if [[ -f app/build/outputs/apk/release/app-release.apk ]]; then
            sha256sum app/build/outputs/apk/release/app-release.apk
          fi
