const today=new Date().toLocaleDateString('en-CA');let state={};try{state=JSON.parse(localStorage.getItem('ironlab-series-v1')||'{}')||{}}catch{}function save(){try{localStorage.setItem('ironlab-series-v1',JSON.stringify(state))}catch{}}

function tick(){const s=Math.max(0,Math.ceil(((state.end||0)-Date.now())/1000));clock.value=String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0');statusEl.textContent=state.end?(s?state.label:'Descanso concluído · próxima série'):'Descanso entre séries'}document.querySelector('#stop').onclick=()=>{state.end=0;save();tick()};day.onchange=draw;draw();tick();setInterval(tick,250)</script></html>
